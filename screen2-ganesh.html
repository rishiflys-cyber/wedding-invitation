<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(ellipse at 50% 45%, #3d0808 0%, #1a0000 55%, #000 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Georgia', serif;
}

.container {
  display: flex; flex-direction: column; align-items: center;
  gap: 14px; padding: 24px 24px 32px;
  animation: rise 1s ease-out;
  width: 100%; max-width: 380px;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

.om {
  font-size: 58px; color: #f0c840; line-height: 1;
  text-shadow: 0 0 30px rgba(240,200,64,0.9), 0 0 70px rgba(240,200,64,0.4);
  animation: glow 3s ease-in-out infinite;
}
@keyframes glow {
  0%,100% { text-shadow: 0 0 25px rgba(240,200,64,0.7), 0 0 50px rgba(240,200,64,0.3); }
  50%      { text-shadow: 0 0 55px rgba(240,200,64,1), 0 0 110px rgba(240,200,64,0.6); }
}

/* Ganesh image with divine glow ring */
.ganesh-wrap {
  position: relative;
  width: min(240px, 62vw);
  height: min(240px, 62vw);
  display: flex; align-items: center; justify-content: center;
}

/* Rotating halo ring */
.halo-ring {
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 2px dashed rgba(240,200,64,0.35);
  animation: spin 18s linear infinite;
}
.halo-ring-2 {
  position: absolute;
  inset: -22px;
  border-radius: 50%;
  border: 1px solid rgba(240,180,40,0.18);
  animation: spin 30s linear infinite reverse;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Glow backdrop circle */
.halo-glow {
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,200,60,0.22) 0%, rgba(255,140,0,0.08) 60%, transparent 100%);
  animation: pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%,100% { opacity: 0.7; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.05); }
}

.ganesh-img {
  width: 100%; height: 100%;
  object-fit: contain;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 20px rgba(255,160,0,0.5)) drop-shadow(0 0 40px rgba(255,120,0,0.25));
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}

.title {
  font-size: 10px; letter-spacing: 6px; color: #e8d5a3;
  text-transform: uppercase; opacity: 0.7;
}

.gold-line {
  display: flex; align-items: center; gap: 10px;
  color: #c9a84c; opacity: 0.4; font-size: 13px;
}
.gold-line::before,.gold-line::after {
  content:''; width: 55px; height: 1px;
  background: linear-gradient(90deg, transparent, #c9a84c, transparent);
}

.blessing {
  text-align: center; color: #e8d5a3; font-size: 14px;
  line-height: 1.9; opacity: 0.8; max-width: 270px;
}
.hindi {
  display: block; font-size: 18px; color: #f0c840;
  margin-bottom: 6px; font-style: normal;
  text-shadow: 0 0 20px rgba(240,200,64,0.4);
}

.tap-hint {
  font-size: 9px; letter-spacing: 3px; color: #e8d5a3;
  text-transform: uppercase; opacity: 0.35;
  animation: breathe 2.5s ease-in-out infinite;
}
@keyframes breathe { 0%,100%{opacity:.2} 50%{opacity:.55} }

/* Floating petals */
.petal {
  position: fixed; top: -20px;
  opacity: 0; pointer-events: none;
  animation: fall linear forwards;
  font-size: 12px;
}
@keyframes fall {
  0%   { opacity: 0.8; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0;   transform: translateY(105vh) rotate(360deg); }
}
</style>
</head>
<body>

<div class="container">
  <div class="om">ॐ</div>
  <div class="title">Shubh Aarambh · शुभ आरम्भ</div>

  <div class="ganesh-wrap">
    <div class="halo-glow"></div>
    <div class="halo-ring-2"></div>
    <div class="halo-ring"></div>
    <img class="ganesh-img" src="ganesh.webp" alt="Lord Ganesha">
  </div>

  <div class="gold-line">✦</div>

  <div class="blessing">
    <span class="hindi">श्री गणेशाय नमः</span>
    May Lord Ganesha bless this sacred union<br>with joy, love &amp; endless prosperity
  </div>

  <div class="tap-hint">tap to continue ✦</div>
</div>

<script>
// Spawn gentle petals
(function(){
  const symbols = ['✿','❀','·','•','❁','✾'];
  const colors  = ['#f0c030','#e8a020','#ffd060','#ff8040','#e8d5a3'];
  function spawn(){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left  = Math.random()*100 + 'vw';
    p.style.color = colors[Math.floor(Math.random()*colors.length)];
    p.style.fontSize = (9+Math.random()*8)+'px';
    p.style.animationDuration = (5+Math.random()*4)+'s';
    p.style.animationDelay   = '0s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 10000);
  }
  setInterval(spawn, 600);
})();
</script>
</body>
</html>
