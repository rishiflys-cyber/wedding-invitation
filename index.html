<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rishabh & Ananya — Wedding Invitation</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #c9a84c;
  --gold-light: #e8d5a3;
  --gold-dark: #8b6914;
  --red: #8b1a1a;
  --cream: #fdf8f0;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Georgia', serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ── SCREEN SYSTEM ── */
.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}
.screen.active {
  opacity: 1;
  pointer-events: all;
}

/* ══════════════════════════════════════════
   SCREEN 1 — ENVELOPE
══════════════════════════════════════════ */
#screen-envelope {
  background: radial-gradient(ellipse at 50% 45%, #3d0808 0%, #1a0000 55%, #000 100%);
  overflow: hidden;
  z-index: 10;
}

/* The 4 envelope flaps that tear outward */
.env-flap {
  position: absolute;
  background: linear-gradient(160deg, #7a1010 0%, #5a0808 60%, #3a0505 100%);
  transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1),
              opacity 0.7s ease 0.3s;
  z-index: 5;
  will-change: transform;
}

/* Top flap */
.env-flap-top {
  top: 0; left: 0; right: 0;
  height: 50%;
  clip-path: polygon(0 0, 100% 0, 60% 100%, 50% 92%, 40% 100%);
  background: linear-gradient(180deg, #5a0808 0%, #8b1010 100%);
  transform-origin: top center;
  border-bottom: 1px solid rgba(201,168,76,0.15);
}
/* Bottom flap */
.env-flap-bottom {
  bottom: 0; left: 0; right: 0;
  height: 50%;
  clip-path: polygon(40% 0, 50% 8%, 60% 0, 100% 100%, 0 100%);
  background: linear-gradient(0deg, #5a0808 0%, #8b1010 100%);
  transform-origin: bottom center;
}
/* Left flap */
.env-flap-left {
  top: 0; left: 0; bottom: 0;
  width: 50%;
  clip-path: polygon(0 0, 100% 40%, 92% 50%, 100% 60%, 0 100%);
  background: linear-gradient(90deg, #5a0808 0%, #7a1212 100%);
  transform-origin: left center;
}
/* Right flap */
.env-flap-right {
  top: 0; right: 0; bottom: 0;
  width: 50%;
  clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 60%, 8% 50%);
  background: linear-gradient(270deg, #5a0808 0%, #7a1212 100%);
  transform-origin: right center;
}

/* Gold border lines on each flap */
.env-flap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: inherit;
  opacity: 0;
}

/* ── Open state — flaps fly outward ── */
#screen-envelope.opening .env-flap-top {
  transform: translateY(-105%);
}
#screen-envelope.opening .env-flap-bottom {
  transform: translateY(105%);
}
#screen-envelope.opening .env-flap-left {
  transform: translateX(-105%);
}
#screen-envelope.opening .env-flap-right {
  transform: translateX(105%);
}
#screen-envelope.opening .env-flap {
  opacity: 0;
}

/* Centre of envelope — wax seal lives here */
.env-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  gap: 24px;
}

.invite-label {
  font-size: 10px;
  letter-spacing: 5px;
  color: var(--gold-light);
  text-transform: uppercase;
  opacity: 0.65;
}

.wax-seal {
  width: 100px; height: 100px;
  cursor: pointer;
  position: relative;
  transition: transform 0.3s ease;
}
.wax-seal:active { transform: scale(0.94); }

.seal-outer {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 32%, #ddb84e, #a07c22 55%, #6b4f10 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 4px 20px rgba(0,0,0,0.7),
    inset 0 2px 3px rgba(255,255,255,0.25),
    inset 0 -3px 6px rgba(0,0,0,0.5);
  border: 2.5px solid rgba(201,168,76,0.45);
  position: relative;
}

.seal-ring {
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 1.5px dashed rgba(201,168,76,0.35);
  animation: spin-slow 20s linear infinite;
}

@keyframes spin-slow {
  to { transform: rotate(360deg); }
}

.seal-monogram {
  font-size: 26px;
  color: #1a0800;
  font-weight: bold;
  letter-spacing: 2px;
  font-family: 'Georgia', serif;
  text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  line-height: 1;
}

.seal-subtext {
  font-size: 7px;
  letter-spacing: 2.5px;
  color: rgba(26,8,0,0.65);
  text-transform: uppercase;
  margin-top: 3px;
}

.tap-hint {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--gold-light);
  text-transform: uppercase;
  opacity: 0.45;
  animation: breathe 2.5s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 0.65; }
}

/* Gold corner ornaments on envelope */
.env-corner {
  position: absolute;
  color: var(--gold);
  opacity: 0.35;
  font-size: 18px;
  z-index: 8;
  pointer-events: none;
}
.env-corner.tl { top: 16px; left: 16px; }
.env-corner.tr { top: 16px; right: 16px; }
.env-corner.bl { bottom: 16px; left: 16px; }
.env-corner.br { bottom: 16px; right: 16px; }

/* ── GANESH WORLD glowing behind the envelope ── */
#ganesh-world {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: radial-gradient(ellipse at 50% 45%, #3d0808 0%, #1a0000 55%, #000 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  opacity: 0;
  transition: opacity 0.5s ease 0.6s;
  pointer-events: none;
}

.gworld-text { display: none; }

#screen-envelope.opening #ganesh-world {
  opacity: 1;
}

.gworld-om {
  font-size: 56px;
  color: var(--gold);
  text-shadow: 0 0 60px rgba(201,168,76,0.8), 0 0 120px rgba(201,168,76,0.4);
  animation: om-pulse 2s ease-in-out infinite;
}

@keyframes om-pulse {
  0%, 100% { text-shadow: 0 0 40px rgba(201,168,76,0.6); }
  50% { text-shadow: 0 0 80px rgba(201,168,76,1), 0 0 160px rgba(201,168,76,0.5); }
}

.gworld-text {
  font-size: 12px;
  letter-spacing: 5px;
  color: var(--gold-light);
  text-transform: uppercase;
  opacity: 0.7;
}

/* ══════════════════════════════════════════
   PARTICLES
══════════════════════════════════════════ */
#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  overflow: hidden;
}

.petal {
  position: absolute;
  top: -20px;
  opacity: 0;
  animation: fall linear forwards;
  pointer-events: none;
}

@keyframes fall {
  0%   { opacity: 0.9; transform: translateY(0) rotate(0deg) scale(1); }
  80%  { opacity: 0.6; }
  100% { opacity: 0; transform: translateY(110vh) rotate(400deg) scale(0.5); }
}

/* ══════════════════════════════════════════
   SCREEN 2 — GANESH (full screen after reveal)
══════════════════════════════════════════ */
#screen-ganesh {
  background: radial-gradient(ellipse at 50% 45%, #3d0808 0%, #1a0000 55%, #000 100%);
}

.ganesh-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 24px 24px 32px;
  animation: fade-rise 1s ease-out;
  width: 100%; max-width: 380px;
}

.ganesh-container .ganesh-title {
  margin-bottom: 28px;
}

@keyframes fade-rise {
  from { transform: translateY(18px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.om-symbol {
  font-size: 76px;
  color: #f0c840;
  text-shadow: 0 0 30px rgba(240,200,64,0.9), 0 0 70px rgba(240,200,64,0.4);
  animation: om-glow 3s ease-in-out infinite;
  line-height: 1;
  margin-bottom: -4px;
}

@keyframes om-glow {
  0%,100% { text-shadow: 0 0 25px rgba(240,200,64,0.7), 0 0 50px rgba(240,200,64,0.3); }
  50%      { text-shadow: 0 0 55px rgba(240,200,64,1), 0 0 110px rgba(240,200,64,0.6); }
}

.ganesh-title {
  font-size: 13px;
  letter-spacing: 6px;
  color: var(--gold-light);
  text-transform: uppercase;
  opacity: 0.7;
}

/* Ganesh image with divine halo rings */
.ganesh-img-wrap {
  position: relative;
  width: min(240px, 62vw);
  height: min(240px, 62vw);
  display: flex; align-items: center; justify-content: center;
}

.halo-glow {
  position: absolute;
  inset: -40px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255,245,150,0.95) 0%,
    rgba(255,210,50,0.75) 20%,
    rgba(255,160,0,0.45) 50%,
    rgba(255,80,0,0.15) 72%,
    transparent 88%
  );
  animation: pulse-glow 2s ease-in-out infinite;
  z-index: 1;
}
@keyframes pulse-glow {
  0%,100% { opacity: 0.85; transform: scale(1); }
  50%      { opacity: 1;    transform: scale(1.15); }
}

/* Outer divine sunburst */
.halo-outer-glow {
  position: absolute;
  inset: -90px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255,220,80,0.45) 0%,
    rgba(255,170,20,0.25) 35%,
    rgba(255,100,0,0.12) 60%,
    transparent 78%
  );
  animation: pulse-glow 2s ease-in-out infinite reverse;
  z-index: 0;
}

.halo-ring {
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 2px dashed rgba(255,220,80,0.7);
  box-shadow: 0 0 12px rgba(255,200,0,0.5), inset 0 0 12px rgba(255,200,0,0.2);
  animation: spin-slow 18s linear infinite;
}

.halo-ring-2 {
  position: absolute;
  inset: -26px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,180,40,0.45);
  box-shadow: 0 0 18px rgba(255,160,0,0.35);
  animation: spin-slow 30s linear infinite reverse;
}

.ganesh-real-img {
  width: 100%; height: 100%;
  object-fit: contain;
  position: relative;
  z-index: 3;
  filter:
    drop-shadow(0 0 12px rgba(255,240,100,1))
    drop-shadow(0 0 30px rgba(255,200,0,0.9))
    drop-shadow(0 0 60px rgba(255,140,0,0.7))
    drop-shadow(0 0 100px rgba(255,80,0,0.4));
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}

.gold-line {
  display: flex; align-items: center; gap: 10px;
  color: #c9a84c; opacity: 0.4; font-size: 13px;
}
.gold-line::before, .gold-line::after {
  content: '';
  width: 55px; height: 1px;
  background: linear-gradient(90deg, transparent, #c9a84c, transparent);
}

.ganesh-blessing {
  text-align: center;
  color: var(--gold-light);
  font-size: 16px;
  line-height: 1.9;
  opacity: 0.8;
  max-width: 290px;
}

.ganesh-blessing .hindi {
  display: block;
  font-size: 22px;
  color: #f0c840;
  margin-bottom: 8px;
  font-style: normal;
  text-shadow: 0 0 20px rgba(240,200,64,0.4);
}

.screen-tap-hint {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--gold-light);
  text-transform: uppercase;
  opacity: 0.35;
  animation: breathe 2.5s ease-in-out infinite;
  margin-top: 4px;
}

/* All placeholder screens keep same dark base */
#screen-invite, #screen-hero {
  background: #0a0500;
}

.placeholder-text {
  color: var(--gold-light);
  font-size: 14px;
  letter-spacing: 3px;
  opacity: 0.5;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div id="particles"></div>
<audio id="bgmusic" loop preload="auto"><source src="Ranjha.mp3" type="audio/mpeg"></audio>

<!-- ══════════════════════════════════════════
     SCREEN 1 — ENVELOPE
══════════════════════════════════════════ -->
<div id="screen-envelope" class="screen active">

  <!-- Ganesh world glows behind as flaps open — just a radiant OM -->
  <div id="ganesh-world">
    <div class="gworld-om">ॐ</div>
  </div>

  <!-- Corner ornaments -->
  <div class="env-corner tl">✦</div>
  <div class="env-corner tr">✦</div>
  <div class="env-corner bl">✦</div>
  <div class="env-corner br">✦</div>

  <!-- Four flaps -->
  <div class="env-flap env-flap-top"></div>
  <div class="env-flap env-flap-bottom"></div>
  <div class="env-flap env-flap-left"></div>
  <div class="env-flap env-flap-right"></div>

  <!-- Centre wax seal -->
  <div class="env-center">
    <div class="invite-label">Wedding Invitation</div>
    <div class="wax-seal" onclick="openEnvelope()" id="seal">
      <div class="seal-outer">
        <div class="seal-ring"></div>
        <div class="seal-monogram">RA</div>
        <div class="seal-subtext">✿ open ✿</div>
      </div>
    </div>
    <div class="tap-hint">✦ tap the seal ✦</div>
  </div>

</div>

<!-- ══════════════════════════════════════════
     SCREEN 2 — GANESH
══════════════════════════════════════════ -->
<div id="screen-ganesh" class="screen" onclick="goTo('screen-invite')">
  <div class="ganesh-container">
    <div class="om-symbol">ॐ</div>
    <div class="ganesh-title">Shubh Aarambh · शुभ आरम्भ</div>

    <div class="ganesh-img-wrap">
      <div class="halo-outer-glow"></div>
      <div class="halo-glow"></div>
      <div class="halo-ring-2"></div>
      <div class="halo-ring"></div>
      <img class="ganesh-real-img" src="ganesh.webp" alt="Lord Ganesha">
    </div>

    <div class="gold-line">✦</div>

    <div class="ganesh-blessing">
      <span class="hindi">श्री गणेशाय नमः</span>
      May Lord Ganesha bless this sacred union<br>with joy, love &amp; endless prosperity
    </div>

    <div class="screen-tap-hint">tap to continue ✦</div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     PLACEHOLDER — more screens coming
══════════════════════════════════════════ -->
<div id="screen-invite" class="screen">
  <div class="placeholder-text">Screen 3 · Personalised Invite</div>
</div>
<div id="screen-hero" class="screen">
  <div class="placeholder-text">Screen 4 · Wedding Hero</div>
</div>

<script>
let current = 'screen-envelope';
let opened = false;

function goTo(id) {
  const prev = document.getElementById(current);
  const next = document.getElementById(id);
  if (!next || id === current) return;
  prev.classList.remove('active');
  next.classList.add('active');
  current = id;
}

function openEnvelope() {
  if (opened) return;
  opened = true;

  // Start music
  const music = document.getElementById('bgmusic');
  music.volume = 0.5;
  music.play().catch(() => {});

  // Trigger flaps flying outward
  document.getElementById('screen-envelope').classList.add('opening');

  // Spawn petals
  spawnPetals(30);

  // After reveal animation, move to full Ganesh screen
  setTimeout(() => {
    goTo('screen-ganesh');
    // Remove opening class so envelope is clean if user goes back
    document.getElementById('screen-envelope').classList.remove('opening');
    opened = false;
  }, 1600);
}

function spawnPetals(n) {
  const c = document.getElementById('particles');
  const symbols = ['✿','❀','✾','·','•','❁'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.color = `hsl(${38 + Math.random()*18}, 72%, ${58+Math.random()*22}%)`;
    p.style.fontSize = (8 + Math.random() * 10) + 'px';
    p.style.animationDuration = (3 + Math.random() * 3) + 's';
    p.style.animationDelay = (Math.random() * 1.2) + 's';
    c.appendChild(p);
    setTimeout(() => p.remove(), 7000);
  }
}
</script>
</body>
</html>
